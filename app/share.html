<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111716" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Shared holidays</title>
</head>
<body>
<main id="sharePage">
  <header><h1 id="title">Shared holidays</h1></header>
  <p class="muted" id="sub">Loading…</p>

  <div id="content" hidden>
    <div class="yearnav">
      <button class="ghost" id="prevYear" aria-label="Previous year">‹</button>
      <b id="yearLabel"></b>
      <button class="ghost" id="nextYear" aria-label="Next year">›</button>
    </div>

    <section class="card summary" id="summary" hidden>
      <div class="big"><b id="remaining"></b><span class="muted" id="remainingLabel"></span></div>
      <p class="if-pencilled" id="ifPencilled" hidden></p>
    </section>

    <h2>Coming up</h2>
    <ul id="upcoming"></ul>

    <h2 id="calendarTitle">Calendar</h2>
    <div id="calendar"></div>
    <div id="legend"></div>

    <div class="actions" style="margin-top:18px">
      <button type="button" id="savePicture">Save as picture</button>
    </div>
  </div>

  <p class="muted foot">A snapshot shared from <a href="./" style="color:inherit">HolidayKeeper</a>. It doesn't update by itself.</p>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-body card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h3 id="sheetTitle"></h3>
      <button type="button" class="ghost" id="sheetClose" aria-label="Close">✕</button>
    </div>
    <ul class="sheet-info" id="sheetInfo"></ul>
  </div>
</div>

<script type="module" src="js/share-page.js"></script>
</body>
</html>
