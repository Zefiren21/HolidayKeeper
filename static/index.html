<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>HolidayKeeper</title>
  <style>
    :root {
      --bg: #f4f6f5; --card: #ffffff; --text: #1a2421; --muted: #5f6f6a;
      --accent: #0f766e; --accent-soft: #d5ede9; --danger: #b42318; --border: #dfe5e3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111716; --card: #1a2220; --text: #e7eeec; --muted: #93a39e;
        --accent: #2dd4bf; --accent-soft: #173a36; --danger: #f97066; --border: #2a3532;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 20px 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    form { display: grid; gap: 12px; margin-bottom: 24px; }
    label { display: grid; gap: 4px; font-size: .875rem; color: var(--muted); }
    input, textarea {
      font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; width: 100%;
    }
    textarea { resize: vertical; min-height: 44px; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .row input { min-width: 0; }
    button {
      font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button[type=submit] { color: #062521; } }
    .error { color: var(--danger); font-size: .875rem; min-height: 1em; margin: 0; }
    h2 { font-size: 1rem; color: var(--muted); margin: 24px 0 8px; font-weight: 600; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    li.card { display: flex; gap: 14px; align-items: center; }
    .count {
      flex: 0 0 64px; height: 64px; border-radius: 12px; background: var(--accent-soft); color: var(--accent);
      display: grid; place-content: center; text-align: center; line-height: 1.1;
    }
    .count b { font-size: 1.4rem; }
    .count small { font-size: .7rem; }
    .info { flex: 1; min-width: 0; }
    .info strong { display: block; overflow-wrap: anywhere; }
    .info .dates, .info .note { color: var(--muted); font-size: .875rem; overflow-wrap: anywhere; }
    .del { background: transparent; color: var(--muted); padding: 8px; font-size: 1.2rem; line-height: 1; }
    .past { opacity: .6; }
    .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  </style>
</head>
<body>
<main>
  <h1>HolidayKeeper</h1>
  <p class="sub">Your upcoming time off, counted down.</p>

  <form id="form" class="card">
    <label>Name <input id="name" required maxlength="100" placeholder="Summer in Lisbon"></label>
    <div class="row">
      <label>Start <input id="start" type="date" required></label>
      <label>End <input id="end" type="date"></label>
    </div>
    <label>Note <textarea id="note" maxlength="500" rows="1" placeholder="Optional"></textarea></label>
    <p class="error" id="error"></p>
    <button type="submit">Add holiday</button>
  </form>

  <h2>Upcoming</h2>
  <ul id="upcoming"></ul>
  <h2 id="pastTitle" hidden>Past</h2>
  <ul id="past"></ul>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const DAY = 86400000;

  function parseDate(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function today() {
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function fmt(s) {
    return parseDate(s).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  function badge(h) {
    const t = today(), start = parseDate(h.start), end = parseDate(h.end);
    if (t < start) {
      const n = Math.round((start - t) / DAY);
      return n === 1 ? ["1", "day to go"] : [String(n), "days to go"];
    }
    if (t <= end) return ["🌴", "now!"];
    return ["✓", "done"];
  }

  function render(items) {
    const t = today();
    const upcoming = items.filter(h => parseDate(h.end) >= t).sort((a, b) => a.start.localeCompare(b.start));
    const past = items.filter(h => parseDate(h.end) < t).sort((a, b) => b.start.localeCompare(a.start));

    fill($("upcoming"), upcoming, false);
    fill($("past"), past, true);
    $("pastTitle").hidden = past.length === 0;
    if (!upcoming.length) $("upcoming").innerHTML = '<li class="empty">Nothing planned yet — add one above.</li>';
  }

  function fill(ul, items, isPast) {
    ul.replaceChildren(...items.map(h => {
      const li = document.createElement("li");
      li.className = "card" + (isPast ? " past" : "");
      const [big, small] = badge(h);
      const days = Math.round((parseDate(h.end) - parseDate(h.start)) / DAY) + 1;
      li.innerHTML = `
        <div class="count"><b></b><small></small></div>
        <div class="info"><strong></strong><div class="dates"></div><div class="note"></div></div>
        <button class="del" aria-label="Delete">×</button>`;
      li.querySelector(".count b").textContent = big;
      li.querySelector(".count small").textContent = small;
      li.querySelector("strong").textContent = h.name;
      li.querySelector(".dates").textContent =
        (h.start === h.end ? fmt(h.start) : `${fmt(h.start)} – ${fmt(h.end)}`) + ` · ${days} day${days > 1 ? "s" : ""}`;
      li.querySelector(".note").textContent = h.note || "";
      li.querySelector(".del").onclick = () => remove(h);
      return li;
    }));
  }

  async function load() {
    const res = await fetch("/api/holidays");
    render(await res.json());
  }

  async function remove(h) {
    if (!confirm(`Delete "${h.name}"?`)) return;
    await fetch(`/api/holidays/${h.id}`, { method: "DELETE" });
    load();
  }

  $("start").addEventListener("change", () => {
    if (!$("end").value || $("end").value < $("start").value) $("end").value = $("start").value;
  });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("error").textContent = "";
    const body = { name: $("name").value, start: $("start").value, end: $("end").value, note: $("note").value };
    const res = await fetch("/api/holidays", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    if (!res.ok) {
      $("error").textContent = (await res.json()).error || "Could not save.";
      return;
    }
    $("form").reset();
    load();
  });

  load();
  setInterval(load, 30000); // pick up changes made from other devices
</script>
</body>
</html>
